<!doctype html>
<html lang="zh"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>AI 同声翻译 · Live Translator</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--fg:#eef0f4;--mut:#8a90a0;--acc:#3b82f6;--me:#1e3a5f;--them:#2a2f3a}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 -apple-system,system-ui,"PingFang SC",sans-serif;background:var(--bg);color:var(--fg);height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid #222}
header b{flex:1;font-size:17px}.pill{font-size:12px;padding:3px 8px;border-radius:99px;background:#333;color:var(--mut)}.pill.ok{background:#14532d;color:#86efac}
button{font:inherit;color:inherit;background:var(--card);border:1px solid #333;border-radius:10px;padding:8px 12px;cursor:pointer}
#log{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 12px;border-radius:14px;background:var(--them)}.msg.me{align-self:flex-end;background:var(--me)}
.msg .o{font-size:13px;color:var(--mut)}.msg .t{font-size:19px}.msg.interim{opacity:.6;font-style:italic;border:1px dashed #555}
#share{padding:12px;text-align:center;background:var(--card);margin:12px;border-radius:14px}#share img,#share canvas{background:#fff;padding:8px;border-radius:8px}
#share .u{font-size:12px;color:var(--mut);word-break:break-all}
footer{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #222;display:flex;gap:10px;align-items:center}
#mic{flex:1;padding:16px;font-size:18px;border-radius:14px;background:var(--acc);border:0;color:#fff}#mic.on{background:#dc2626}
#cfg{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center}#cfg>div{background:var(--card);padding:18px;border-radius:14px;width:min(92vw,420px)}
input,select{width:100%;font:inherit;padding:8px;border-radius:8px;border:1px solid #444;background:#111;color:var(--fg);margin:6px 0 12px}
.small{font-size:12px;color:var(--mut)}
</style></head><body>
<header><b data-i="title"></b><span id="st" class="pill"></span><button id="langBtn"></button><button id="cfgBtn">⚙︎</button></header>
<div id="share"><div data-i="scan" style="margin-bottom:8px"></div><div id="qr"></div><div class="u" id="url"></div><button id="copy" style="margin-top:8px" data-i="copy"></button></div>
<div id="log"></div>
<footer><button id="mic"></button></footer>
<div id="cfg"><div>
<b data-i="settings"></b>
<div class="small" data-i="engineHelp"></div>
<label class="small">OpenAI API Key</label><input id="key" type="password" placeholder="sk-... (optional)">
<label class="small" data-i="voice"></label><label style="display:flex;gap:8px;align-items:center"><input id="tts" type="checkbox" style="width:auto;margin:0"><span data-i="ttsLabel"></span></label>
<div style="display:flex;gap:8px;margin-top:14px"><button id="save" data-i="save"></button><button id="close" data-i="close"></button></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
const $=s=>document.querySelector(s), LS=localStorage;
const room=new URLSearchParams(location.search).get('room'); const isHost=!room;
let lang=LS.lang||(isHost?'zh':(navigator.language||'en').startsWith('zh')?'zh':'en');
const other=l=>l==='zh'?'en':'zh', BCP={zh:'zh-CN',en:'en-US'};
const T={zh:{title:'AI 同声翻译',scan:'请对方扫码加入（无需安装）',copy:'复制链接',settings:'设置',engineHelp:'默认用免费翻译（Google→MyMemory）。填入你自己的 OpenAI Key 质量更好，只存在本机浏览器。',voice:'语音',ttsLabel:'朗读对方的译文',save:'保存',close:'关闭',start:'🎤 点击开始说中文',stop:'⏹ 停止',lang:'我说 中文',wait:'等待对方',conn:'已连接',solo:'单机模式',err:'连接失败',nosr:'此浏览器不支持语音识别，请用 Chrome / Safari',copied:'已复制'},
 en:{title:'AI Live Translator',scan:'Ask the other person to scan (no install)',copy:'Copy link',settings:'Settings',engineHelp:'Uses free translation by default (Google→MyMemory). Paste your own OpenAI key for better quality; stored only in this browser.',voice:'Voice',ttsLabel:"Speak the other person's translation",save:'Save',close:'Close',start:'🎤 Tap to speak English',stop:'⏹ Stop',lang:'I speak EN',wait:'Waiting for peer',conn:'Connected',solo:'Solo mode',err:'Connection failed',nosr:'Speech recognition unsupported; use Chrome / Safari',copied:'Copied'}};
const t=k=>T[lang][k]; let status='wait';
function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 $('#langBtn').textContent=t('lang')+' ⇄';$('#mic').textContent=listening?t('stop'):t('start');$('#mic').classList.toggle('on',listening);
 $('#st').textContent=t(status);$('#st').className='pill'+(status==='conn'?' ok':'');}
$('#langBtn').onclick=()=>{lang=other(lang);LS.lang=lang;if(listening){stopRec();startRec()}render()};
// settings
$('#cfgBtn').onclick=()=>{$('#key').value=LS.okey||'';$('#tts').checked=LS.tts!=='0';$('#cfg').style.display='flex'};
$('#close').onclick=()=>$('#cfg').style.display='none';
$('#save').onclick=()=>{LS.okey=$('#key').value.trim();LS.tts=$('#tts').checked?'1':'0';$('#cfg').style.display='none'};
// translation: OpenAI (user key) -> Google gtx -> MyMemory
const cache=new Map();
async function translate(text,from,to){const k=from+to+text;if(cache.has(k))return cache.get(k);let r='';
 if(LS.okey){try{const res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+LS.okey},
  body:JSON.stringify({model:'gpt-4o-mini',temperature:0,messages:[{role:'system',content:`Translate the user's spoken ${from==='zh'?'Chinese':'English'} into natural spoken ${to==='zh'?'Simplified Chinese':'English'}. Output only the translation.`},{role:'user',content:text}]})});
  const j=await res.json();r=j.choices?.[0]?.message?.content?.trim()||''}catch(e){}}
 if(!r){try{const j=await (await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${BCP[from]}&tl=${BCP[to]}&dt=t&q=${encodeURIComponent(text)}`)).json();r=j[0].map(x=>x[0]).join('')}catch(e){}}
 if(!r){try{const j=await (await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${BCP[from]}|${BCP[to]}`)).json();r=j.responseData?.translatedText||''}catch(e){}}
 if(r)cache.set(k,r);return r||'[translation failed]';}
// subtitles
const bubbles={};
function show(id,who,orig,trans,interim){let b=bubbles[id];if(!b){b=bubbles[id]=document.createElement('div');b.innerHTML='<div class="o"></div><div class="t"></div>';$('#log').appendChild(b)}
 b.className='msg'+(who==='me'?' me':'')+(interim?' interim':'');b.querySelector('.o').textContent=orig;b.querySelector('.t').textContent=trans||'…';$('#log').scrollTop=1e9;}
// TTS: only confirmed text is spoken
let speaking=false;
function speak(text,l){if(LS.tts==='0'||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(text);u.lang=BCP[l];
 u.onstart=()=>{speaking=true;if(listening)try{rec.abort()}catch(e){}};u.onend=u.onerror=()=>{speaking=false;if(listening)try{rec.start()}catch(e){}};speechSynthesis.speak(u);}
// sync: WebRTC (PeerJS) when it connects, else ntfy.sh relay (works behind strict NATs)
const me=Math.random().toString(36).slice(2,10);const roomId=room||('aitr-'+Math.random().toString(36).slice(2,8)+Math.random().toString(36).slice(2,8));
let conn=null,relayPeer=false,lastRelayInterim=0;const seen=new Set();
const rtcOpen=()=>conn&&conn.open;
function send(m){if(rtcOpen())return conn.send(m);if(!relayPeer&&m.type!=='hello')return;
 if(m.type==='interim'){const n=Date.now();if(n-lastRelayInterim<1500)return;lastRelayInterim=n}
 fetch('https://ntfy.sh/'+roomId,{method:'POST',body:JSON.stringify({...m,from:me})}).catch(()=>{})}
function setConn(){status='conn';render();$('#share').style.display='none'}
function onData(m){if(m.type==='hello'){relayPeer=true;setConn();if(!m.ack)send({type:'hello',ack:1});return}
 if(m.type==='final'){if(seen.has(m.id))return;seen.add(m.id);show(m.id,'them',m.orig,m.trans,false);speak(m.trans,m.to)}
 else if(m.type==='interim'&&!seen.has(m.id))show(m.id,'them',m.orig,m.trans,true)}
const es=new EventSource('https://ntfy.sh/'+roomId+'/sse');
es.onopen=()=>{if(!isHost)fetch('https://ntfy.sh/'+roomId,{method:'POST',body:JSON.stringify({type:'hello',from:me})})};
es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.event!=='message')return;const m=JSON.parse(d.message);if(m.from===me)return;onData(m)}catch(x){}};
function bind(c){conn=c;c.on('open',setConn);c.on('data',onData);c.on('close',()=>{if(!relayPeer){status=isHost?'wait':'err';render()}})}
let peer;
if(isHost){const url=location.origin+location.pathname+'?room='+roomId;$('#url').textContent=url;const q=qrcode(0,'M');q.addData(url);q.make();$('#qr').innerHTML=q.createImgTag(5,8);$('#copy').onclick=()=>{navigator.clipboard?.writeText(url);$('#copy').textContent=t('copied')}}
if(window.Peer){peer=isHost?new Peer(roomId):new Peer();
 peer.on('open',()=>{if(!isHost)bind(peer.connect(room,{reliable:true}))});
 peer.on('connection',c=>{if(rtcOpen())conn.close();bind(c)});peer.on('error',e=>console.warn('peer',e.type));}
if(!isHost)$('#share').style.display='none';
// speech recognition
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec,listening=false,seg=0,lastI=0,iTimer;
function startRec(){if(!SR){alert(t('nosr'));return}rec=new SR();rec.lang=BCP[lang];rec.continuous=true;rec.interimResults=true;const from=lang,to=other(lang);
 rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i],txt=r[0].transcript.trim();if(!txt)continue;const id=(isHost?'h':'g')+seg;
  if(r.isFinal){seg++;clearTimeout(iTimer);show(id,'me',txt,'',false);translate(txt,from,to).then(tr=>{show(id,'me',txt,tr,false);send({type:'final',id,orig:txt,trans:tr,to});if(!(conn&&conn.open))speak(tr,to)})}
  else{show(id,'me',txt,'',true);send({type:'interim',id,orig:txt,trans:''});clearTimeout(iTimer);iTimer=setTimeout(()=>translate(txt,from,to).then(tr=>{if(bubbles[id]?.classList.contains('interim')){show(id,'me',txt,tr,true);send({type:'interim',id,orig:txt,trans:tr})}}),400)}}};
 rec.onend=()=>{if(listening&&!speaking)try{rec.start()}catch(e){}};rec.start();listening=true;render();}
function stopRec(){listening=false;try{rec.stop()}catch(e){}render()}
$('#mic').onclick=()=>listening?stopRec():startRec();
render();
</script></body></html>
